name: github.com/apeirora/showroom-msp-metal-api
version: ${VERSION}
provider:
  name: apeirora-showroom

resources:
  # Syncer components
  - name: syncer-image
    type: ociImage
    version: "${VERSION}"
    access:
      type: ociArtifact
      imageReference: ghcr.io/${GITHUB_REPOSITORY}-syncer:${VERSION}

  - name: syncer-chart
    type: helmChart
    version: "${VERSION}"
    access:
      type: ociArtifact
      imageReference: ghcr.io/${GITHUB_REPOSITORY}/charts/showroom-msp-metal-api-syncer:${VERSION}


  # Metal API
  - name: metal-api-chart
    type: helmChart
    version: "${VERSION}"
    access:
      type: ociArtifact
      imageReference: ghcr.io/${GITHUB_REPOSITORY}/charts/metal-api:${VERSION}

